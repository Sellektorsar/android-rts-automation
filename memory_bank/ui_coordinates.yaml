    tap_dy: 30
    radial_live: [577, 1374]
    panel_context: "wall / LV.5 -> LV.6 / duration 4277"
    confirm_live: [820, 2315]
    confirm_state: "inactive_gray"   # не нажимать при нехватке требований
    task_status: "enabled: false (Стена LV.5, требования замка/лорда)"
    # Live 2026-10-23, шаблонный поиск кузницы (building_forge):
    # здание conf 0.923@1.0 → тап (528,621) → «Улучшить» (388,825)
    # conf 0.794@scale 0.9 → панель «Кузница» LV.5→LV.6, timer 1188 c,
    # требуется Замок 6 ур. (сейчас 5) → синяя кнопка серая (S=22, B-R=-4).
    forge_live_2026_10_23:
      building_match: {x: 528, y: 528, confidence: 0.923, scale: 1.0}
      radial: {x: 388, y: 825, confidence: 0.794, scale: 0.9}
      panel: "forge / LV.5 -> LV.6 / duration 1188"
      requirement_blocker: "Замок 5 ур. / 6 ур."
      confirm_state: "inactive_gray"
      note: "радиальное меню — мировой слой: искать мультимасштабно (0.8..1.2), порог 0.75"

    forge_camera_shift_2026_10_23:
      # Камера сдвинута свайпом; спрайт перерисован ~на 2% меньше.
      building_match: {x: 768, y: 528, confidence: 0.764, scale: 0.98}
      radial: {x: 648, y: 825, confidence: 0.798}
      panel: "forge / LV.5 -> LV.6 / duration 1188"
      confirm_state: "inactive_gray"
      single_scale_failure: "conf 0.661–0.685 при scale 1.0 — ниже порога 0.70"
      grid_scan_fallback: "2 попадания, conf 0.798, OCR «Ky3HMLa»"
      fix: "GaussianBlur k=5 для шаблона и кадра + масштабы 0.80..1.20"
      restored_camera: {x: 546, y: 528, confidence: 0.950, scale: 1.0}

    forge_sweep_2026_10_23:
      # Камера сдвинута вручную; кузница была вне стартового кадра.
      # Координаты действительны только для этой позиции камеры.
      sweep: {enabled: true, cols: 3, rows: 3, step_px: 600}
      found_at_cell: "-600,0 (позиция 5 из 8, 42.1 c)"
      direct_search: "не найдена"
      building_match: {x: 470, y: 468, confidence: 0.756, scale: 1.05}
      tap: [470, 566]
      radial: {x: 326, y: 788, confidence: 0.805}
      panel: "forge / LV.5 -> LV.6 / duration 1188"
      confirm_state: "inactive_gray"

