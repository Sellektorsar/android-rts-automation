        template: "building_wall_gate"
        tap_dy: 73
        verified: "2026-10-23: живой тап (830,1430) -> баннер «Стена Замка»; порог 0.75"
      hospital:
        template: "building_hospital"
        tap_dy: 55
        verified: "2026-10-23: живой тап (400,1395) -> баннер «Госпиталь»; порог 0.85 (красные церкви дают 0.65–0.75)"
      forge:
        template: "building_forge"
        tap_dy: 128
        verified: "2026-10-23: conf 0.97@0.98 центр (472,441) -> тап (472,566) -> «Улучшить» 0.83; порог 0.80"
      locked_temple: [590, 350]
    campaign_portal:
      # Проверено 2026-10-22: основание портала открывает карту кампании.
      # Позиция и размер зависят от камеры города; портал может быть вне
      # экрана. Ищем шаблон в нескольких размерах (зум меняет его размер).
