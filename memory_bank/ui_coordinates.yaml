      region: [426, 1974, 656, 2016]
      text: "Забрать награды"
      state: "inactive_gray"          # не нажимать до завершения этапа 7
    back: "hardware_back"             # одно нажатие → city_view

  campaign_map:
    # Подтверждено 2026-10-22. Старые координаты этапов ниже оставлены
    # как исторические; stage_7 обновлён по живому кадру.
