# База координат и зон интерфейса (Разрешение: 1080 x 2436)

device:
  resolution: [1080, 2436]
  orientation: portrait

screens:
  royal_road:
    # Подтверждено на живом кадре 2026-10-22, глава 4.
    title: [541, 403]
    title_region: [374, 382, 708, 424]
    chapter_banner_y: 850
    entry_crown: [75, 1960]          # нажимать только при OCR-баннере главы
    entry_banner_text_region: [146, 1943, 572, 1971]
    entry_text_center_not_clickable: [359, 1957]
    current_quest: "Вызов Спасителя порядка, этап 7"
    forward_button:
      point: [870, 949]
      region: [820, 928, 920, 970]
      template: "btn_vpered_active"
    chapter_reward_button:
