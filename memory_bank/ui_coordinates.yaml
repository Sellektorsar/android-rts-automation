      search_region_live: [270, 1096, 540, 974]  # широкая нижняя область
      find_method: "vision.find_template_multiscale"  # размер шаблона 0.70..1.20
      scales: [0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00, 1.05, 1.10, 1.15, 1.20]
      threshold_live: 0.60       # синее свечение/анимация снижают корреляцию
      match_center_example: [526, 1692]
      match_confidence_example: 0.616
      tap_point_live: [526, 1790] # центр шаблона + 98 px вниз
      match_multiscale_example_2026_10_22: {x: 452, y: 1766, confidence: 0.627, scale: 1.15}
      tap_multiscale_example: [452, 1879]  # центр + 98*scale
      historical_tap_point: [522, 1230]
      note: "Если шаблон не найден даже при 0.60 на всех масштабах — портал вне экрана; не панорамировать вслепую."
    alliance_help_bubble:
      search_region: [750, 1800, 1050, 2200]

