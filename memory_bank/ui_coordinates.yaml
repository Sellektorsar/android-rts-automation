      title_anchor: "title_campaign"
      title_region: [324, 73, 756, 244]
      back_button: [60, 130]
      help_icon: [1015, 130]
      difficulty_simple: [850, 205]
      difficulty_hard: [1010, 205]
      stage_7: [955, 1200]
      stage_7_template: "campaign_stage_7"
      stage_7_dark: [943, 1416]          # карта затемнена диалогом босса
      stage_7_dark_template: "campaign_stage_7_dark"
      stage_7_search_region: [756, 852, 324, 1218]
      current_difficulty: "Простой"
      completed_stages_visible: [1, 2, 3, 4, 5]
      active_stage: 7
    header:
      title_pos: [540, 55]
      back_button: [60, 55]
      help_icon: [950, 55]
    modes:
      normal: [800, 130]
      hard: [920, 130]
    stages:
      stage_1:
        center: [730, 2070]
        radius: 60
        type: portal_blue
      stage_2:
        center: [275, 2000]
        radius: 60
        type: portal_blue
      stage_3:
        center: [245, 1450]
      stage_4:
        center: [420, 1310]
      stage_5:
        center: [750, 1440]
      stage_6:
        center: [760, 1180]
      stage_7:
        center: [955, 1200]        # подтверждено 2026-10-22, шаблон campaign_stage_7
      stage_8:
        center: [790, 680]
      stage_9:
        center: [440, 360]
      stage_10:
        center: [260, 160]

  stage_briefing:
    title_pos: [540, 950]
    skill_preview: [365, 1115]
    rewards_row: [500, 1340]
    challenge_button: [540, 1875]     # подтверждено 2026-10-22, btn_stage_challenge=0.993
    challenge_template: "btn_stage_challenge"
    confirmed_stage_7:
      title: "Этап 7"
      objective: "Выжить в течение 120 сек."
      new_skill: "Удар дракона"
      first_reward:
        speedup: "5 min x1"
        food: "1.0K x2"
        wood: "1.0K x2"
      hero_test_dialog:
        # Появляется после challenge_button; OCR ненадёжен.
        continue_button: [765, 1345]        # зелёное «Испытание»
        continue_template: "btn_hero_test_confirm"
        search_region: [540, 1218, 486, 292]
        threshold: 0.95
        forbidden_blue_upgrade: [315, 1340] # «Укрепление героизма» — не нажимать

  battle:
    # Проверено на живом бою этапа 7, 2026-10-22.
    state: "tutorial_battle"
    pause_button: [62, 150]
    pause_template: "battle_pause"
    pause_template_fast: "battle_pause_fast"   # для кадров 540x1218
    pause_threshold: 0.90
    heads_up:
      # Плашка уведомления может лежать поверх pause_button; шаблон паузы
      # при этом всё ещё находится, но тап уходит в системную плашку.
      dismiss_before_challenge: true
      dismiss_before_pause: true
      dismiss_swipe: [[540, 220], [540, 10]]
      note: "Если меню паузы не открылось — Back не нажимать."
    pause_menu:
      title: "Пауза"
      # Нижняя строка: Выйти | Начать сначала | Продолжить | Параметры.
      exit_button: [207, 1552]
      exit_template: "btn_battle_exit"
      exit_search_region: [54, 1340, 324, 341]
      exit_threshold: 0.90
      # Нажатие «Выйти» сразу возвращает на карту кампании, без оплаты.
      for_exit_state: "campaign_map"
      forbidden_buttons:
        - "Начать сначала"
        - "Продолжить"
        - "Параметры"
        - "Повторить"
        - "Купить"
    skill_selection:
      # Оверлей повышения уровня ВО ВРЕМЯ боя, не конец боя.
      state: "skill_selection"
      anchor: "title_skill_choice"
      confirm_button: [545, 1750]
      confirm_template: "btn_skill_confirm"
      confirm_search_region: [270, 1583, 540, 487]
      confirm_threshold: 0.90
      first_card: [183, 1096]     # один тап, если кнопки «Подтвердить» нет
      card_region: [24, 792, 315, 598]
      rule: "Сначала «Подтвердить»; если нет — один раз первая карточка, затем «Подтвердить»."
      forbidden:
        - "Back"
        - "повторный перебор карточек"
    ocr_hazard: "«Выжить в течение …» распознаётся как «BbIKMTb» (Выйти)"
    result_flow:
      exit_to: "campaign_map"
      then_back_to: "city_view"

  stage_victory:
    banner_pos: [540, 900]
    rewards_row: [500, 1240]
    continue_tap: [540, 1850]

  dialogue:
    text_box_area:
      x_min: 100
      y_min: 2080
      x_max: 980
      y_max: 2400
    safe_tap: [540, 2250]
    indicator: [940, 2380]

  quests_menu:
    verified: "2026-10-22"
    anchor: "title_daily_quests"
    header:
      back_button: [80, 160]
      help_icon: [930, 160]
    tabs:
      growth_quests: [386, 344]
      daily_quests: [692, 344]
    categories:
      weapon_quests: [405, 494]
      construction_quests: [405, 639]
      other_quests: [390, 1819]
    claim_reward_button:
      template: "btn_claim_green"
      x: 884
      y_positions: [744, 890, 1034, 1180, 1324, 1470]
      threshold: 0.90
      note: "6 наград роста; склад 1/2 без кнопки"

  city_view:
    hud_top:
      lord_avatar: [90, 192]
      lord_power: [285, 185]
      lord_vip: [240, 240]
      lord_energy: [240, 120]
      food: [415, 120]
      wood: [580, 120]
      gold: [815, 185]
      gems: [1010, 185]
    left_hud:
      builder_slot_1: [75, 402]
      # DANGER: открывает платное окно «Разблокировать золотой молот»
      quest_guide_hammer: [70, 565]
    bottom_nav:
      # ВНИМАНИЕ: btn_world_map (110,2335) — мини-город/дракон, карту мира
      # не открывает. Глобус справа от него открывает чат мира.
      world_map_toggle: [115, 2355]       # историческая точка, не карта мира
      world_chat_globe: [250, 2292]       # открывает unknown-чат; Back закрывает
      world_chat_template: "btn_world_map_globe"
      quests: [295, 2375]
      bag: [455, 2375]
      mail: [615, 2375]
      alliance: [770, 2375]
      lord: [930, 2375]
      chat_ticker: [540, 2285]
    right_hud:
      demon_invasion: [925, 695]
    plots:
      plot_a: [670, 1320]
      plot_b: [920, 1440]
      plot_c: [860, 1650]
      plot_d: [670, 1830]
      plot_e: [340, 1920]
      plot_f: [560, 2060]
    buildings:
      castle: [200, 1150]
      castle_level_badge: [160, 1220]
      wall: [639, 1500]          # проверено: открывает радиальное «Улучшить»
      locked_temple: [590, 350]
    campaign_portal:
      # Проверено 2026-10-22: основание портала открывает карту кампании.
      # Позиция и размер зависят от камеры города; портал может быть вне
      # экрана. Ищем шаблон в нескольких размерах (зум меняет его размер).
      template: "portal_campaign"
      search_region: [324, 876, 702, 1412]       # историческая область
      search_region_live: [270, 1096, 540, 974]  # широкая нижняя область
      find_method: "vision.find_template_multiscale"  # размер шаблона 0.70..1.20
      scales: [0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00, 1.05, 1.10, 1.15, 1.20]
      threshold_live: 0.60       # синее свечение/анимация снижают корреляцию
      match_center_example: [526, 1692]
      match_confidence_example: 0.616
      tap_point_live: [526, 1790] # центр шаблона + 98 px вниз
      match_multiscale_example_2026_10_22: {x: 452, y: 1766, confidence: 0.627, scale: 1.15}
      tap_multiscale_example: [452, 1879]  # центр + 98*scale
      historical_tap_point: [522, 1230]
      note: "Если шаблон не найден даже при 0.60 на всех масштабах — портал вне экрана; не панорамировать вслепую."
    alliance_help_bubble:
      search_region: [750, 1800, 1050, 2200]

  popups:
    close_button_candidate_zones:
      - [960, 220]    # Верхний правый угол типового модального окна
      - [920, 380]    # Уменьшенное окно акции
      - [80, 80]      # Верхний левый угол (кнопка назад/крестик)
    event_new_kingdom:
      close_button: [975, 642]
      close_template: "btn_close_event_x"
      # Золотой крестик; нажимать только его, не карточки покупки.
      # Тап может потребовать повтора ~5 с.
    daily_login:
      claim_button: [540, 1657]
      claim_text: "Забрать награды"
      # Бесплатная награда; не перепутать с event purchase.
    reward_receipt:
      close_tap: [540, 1997]
      template: "banner_reward_received"
      # Проверено: тап по нижнему центру закрывает экран награды.

  # Проверено на живом устройстве 2026-10-21/22.
  building_upgrade:
    # Панель «Требуется» + синяя кнопка «Улучшить».
    # Зелёная кнопка «Получить сейчас» (гемы) находится слева и НИКОГДА
    # не нажимается: поиск подтверждения ограничен правой половиной.
    panel_title_region: [324, 97, 486, 121]
    levels_region: [410, 1023, 302, 121]
    required_region: [324, 1364, 432, 194]
    radial_region: [453, 1218, 280, 267]
    confirm_region: [594, 2192, 486, 243]
    timer_region: [648, 2192, 324, 146]
    # Найденные элементы на эталонном кадре 1080x2436:
    radial_upgrade: [590, 1358]
    blue_confirm: [820, 2315]
    green_gem_confirm: [280, 2258]   # не нажимать
    timer_example: "11:52"           # 712 секунд
    levels_example: "LV.4 -> LV.5"

  city_gifts:
    # Подарок торговца с зелёной галочкой над повозкой.
    search_region: [32, 438, 1015, 1705]
    gift_icon: [865, 570]
    reward_close_tap: [540, 1997]
    reward_template: "banner_reward_received"
