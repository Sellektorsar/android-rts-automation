# Конфигурация бота War & Order (WaO_bot)

device:
  adb_path: "C:\\platform-tools\\adb.exe"
  ip: "192.168.31.156"
  port: 43981
  timeout_sec: 10
  # Сколько секунд можно переиспользовать последний кадр (экономия ADB)
  frame_ttl_sec: 1.5
  # Быстрый поток кадров (screenrecord + ffmpeg) вместо обычного screencap;
  # при недоступности ffmpeg/adb автоматически отключается и бот падает на screencap.
  fast_capture: true
  fast_capture_time_limit: 180
  # Не давать экрану гаснуть: без этого Wi-Fi ADB отваливается и разбудить
  # устройство удалённо невозможно.
  keep_screen_on: true
  # Переподключение по Wi-Fi: прямое подключение, затем поиск через `adb mdns services`
  reconnect_interval_sec: 30
  auto_discovery: true
  # Режим ввода: "adb" (Bezier curves + Gaussian jitter) или "esp32_ble" (аппаратный BLE HID контроллер)
  input_mode: "adb"
  esp32:
    port: "COM3"
    baudrate: 115200
    calibration_x: 1000
    calibration_y: 1000

game:
  package: "com.camelgames.superking"
  activity: ".UnityPlayerActivity"

anti_detect:
  # Случайное смещение клика от центра кнопки (в пикселях)
  click_jitter_radius: 8
  # Случайные задержки (в секундах) между микро-действиями
  min_delay: 0.6
  max_delay: 1.4
  # Использовать сглаженные свайпы вместо мгновенных
  smooth_swipes: true

perception:
  # OCR используется как резерв, когда якорные шаблоны не нашли экран
  allow_ocr: true
  # Полный кадр распознаётся в уменьшенном виде (0.5 = в 4 раза быстрее)
  ocr_scale: 0.5
  # Поиск шаблонов на уменьшенном кадре (0.5 = в 4 раза быстрее)
  match_scale: 0.5
  # Средняя яркость нижней навигации: в городе ~90, под затемнением модалки ~17
  city_nav_min_brightness: 45
  # Как часто перечитывать ресурсы и силу из HUD (секунды)
  hud_interval_sec: 60

recovery:
  enabled: true
  reconnect_interval_sec: 30
  relaunch_after_failures: 3

logging:
  dir: "logs"
  save_failure_frames: true

tasks:
  popup_closer:
    enabled: true
    interval_sec: 5

  alliance_help:
    # TODO: аккаунт пока не в альянсе; включить после вступления и калибровки шаблонов
    enabled: false
    interval_sec: 60

  city_harvest:
    enabled: true
    interval_sec: 180

  city_build:
    # Постройка второстепенных зданий на пустых квадратных ячейках
    # справа-снизу от замка. Камера после постройки слегка смещается,
    # поэтому фиксированные точки не задаются: ячейки ищутся шаблоном
    # plot_empty_live на каждом свежем кадре (порог 0.40, 9 ячеек).
    # Тип выбирается каруселью (Ферма/Лесопилка/Учебный лагерь/Медпалатка),
    # нажимается только синяя кнопка «Построить».
    enabled: true
    interval_sec: 15
    plots: []

  city_gifts:
    # Подарок торговца с зелёной галочкой -> баннер награды -> тап по полю.
    enabled: true
    interval_sec: 900

  quest_rewards:
    # Зелёные «Забрать награды» на экране ежедневных заданий.
    # Проверено вживую 2026-10-22: +477, уровень 3→4, оплата не открылась.
    enabled: true
    interval_sec: 45

  chapter_quest:
    # TODO: включить после реализации полного пайплайна этапа кампании
    enabled: false
    interval_sec: 15

  building_upgrade:
    # Проверенный сценарий: выделить здание -> «Улучшить» -> синяя кнопка.
    # Задача не нажимает зелёную кнопку гемов; при нехватке условий выходит.
    # Точки откалиброваны по камере 2026-10-23 (после застройки всех ячеек):
    # 18 зданий квартала. Тип в имени — предварительный, авторитетный тип
    # берётся из OCR заголовка панели и пишется в memory_bank/building_spots.json.
    # Серые кнопки не нажимаются; при «Перейти» точка помечается как
    # упёршаяся в уровень замка и пропускается до его повышения.
    enabled: true
    interval_sec: 60
    spots:
      - {name: "farm",    point: [600, 1030]}
      - {name: "farm",    point: [750, 1080]}
      - {name: "farm",    point: [700, 1240]}
      - {name: "farm",    point: [545, 1200]}
      - {name: "camp",    point: [430, 1260]}
      - {name: "sawmill", point: [280, 1370]}
      - {name: "sawmill", point: [300, 1560]}
      - {name: "sawmill", point: [482, 1670]}
      - {name: "tent",    point: [432, 1440]}
      - {name: "tent",    point: [590, 1350]}
      - {name: "tent",    point: [625, 1580]}
      - {name: "sawmill", point: [650, 1780]}
      - {name: "camp",    point: [455, 1800]}
      - {name: "sawmill", point: [900, 1160]}
      - {name: "tent",    point: [786, 1430]}
      - {name: "farm",    point: [968, 1520]}
      - {name: "camp",    point: [812, 1705]}
      - {name: "camp",    point: [787, 1870]}
    sweep:
      # Обход камерой выключен: все 19 точек в текущем кадре, а шаблонные
      # здания разных уровней не совпадают с эталонами LV1.
      enabled: false
      cols: 3
      rows: 3
      step_px: 600
      duration_ms: 900
      settle_s: 1.5
    castle:
      # Когда все точки упёрлись в замок, задача открывает панель любого
      # упёршегося здания и жмёт «Перейти». На панели замка нажимается
      # только синяя кнопка; зелёные кнопки гемов запрещены.
      # Живой зонд 2026-10-23: «Перейти» открывает панель «Замок» LV5->6
      # с таймером 01:33:43; кнопка улучшения на живой панели не нажималась.
      enabled: true
      retry_sec: 600
      panel_timeout_sec: 15

  battle_auto:
    # Боевой автопилот: джойстик (круговой кайт), выбор/подтверждение
    # навыка, экран победы. Flow проверен зондами (probe_stage7_combat);
    # живой прогон запущен 2026-10-22.
    enabled: true
    interval_sec: 30

  research_auto:
    # Автопилот науки: старт исследования в меню Институт / дерево исследований.
    # Требует live-калибровку шаблона btn_research_start.
    enabled: true
    interval_sec: 180

  barracks_train:
    # Найм войск по проверенной последовательности (капсулы с координатами).
    # TODO: после живой калибровки — переход на шаблонные точки казармы.
    enabled: true
    interval_sec: 300

  gathering:
    enabled: true
    interval_sec: 600
    preferred_resources: ["food", "wood", "stone", "iron"]

policy_and_safety:
  mode: "bounded_autonomy" # observe_only -> assisted_low_risk -> bounded_autonomy
  require_fresh_frame_before_action: true
  require_frame_change_verification: true
  max_consecutive_failures: 2
  stop_on_unknown_dialog: true
  stop_on_payment_screen: true
  # recover — закрывать неизвестный экран и возвращаться в город; stop — падать в паузу
  on_unknown: "recover"
  unknown_timeout_sec: 25
  max_back_attempts: 2
  risk_gates:
    real_money_purchase: "deny"
    premium_currency: "require_owner_approval"
    player_pvp: "require_owner_approval"
    teleportation: "require_owner_approval"
    rare_item_consumption: "require_owner_approval"
    social_messaging: "deny"
